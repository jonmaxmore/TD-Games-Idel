# Local stack. For now only the friend-room game server; PostgreSQL 16 and Redis 7 join here in M1 (guests, match
# records and the room registry move out of memory then).
#   docker compose -f infra/docker-compose.yml up --build    -> ws://localhost:8787/v1/ws, then npm run dev for the client
# Deployed, a reverse proxy in front ends TLS (players use wss:// only) and its address goes in TRUST_PROXY.
services:
  game:
    build:
      context: ..
      dockerfile: infra/game.Dockerfile
    ports:
      - "127.0.0.1:8787:8787" # this machine only; nothing is exposed to the network
    environment:
      ORIGINS: "http://localhost:5173,http://127.0.0.1:5173" # required: HOST is 0.0.0.0 inside the container
    volumes:
      - replays:/data/replays
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
volumes:
  replays:
